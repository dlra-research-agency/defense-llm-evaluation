task:
  name: threat-classification
  description: Classify defense intelligence reports by threat category and severity
  version: "1.0"

model_configs:
  - provider: openai
    model: gpt-4o
    temperature: 0.0
    max_tokens: 256
  - provider: anthropic
    model: claude-sonnet-4-20250514
    temperature: 0.0
    max_tokens: 256
  - provider: google
    model: gemini-2.5-flash
    temperature: 0.0
    max_tokens: 256
  - provider: mistral
    model: mistral-large-latest
    temperature: 0.0
    max_tokens: 256
  - provider: alibaba
    model: qwen-2.5-72b
    temperature: 0.0
    max_tokens: 256
  - provider: meta
    model: llama-3.1-70b
    temperature: 0.0
    max_tokens: 256

evaluation:
  mode: zero-shot
  metrics:
    - f1-weighted
    - precision
    - recall
  n_samples: 200
  categories:
    - cyber-intrusion
    - terrorism
    - state-sponsored
    - criminal
    - insider-threat
